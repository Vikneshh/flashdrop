# Local infrastructure for development.
# MongoDB = permanent records (products, paid orders)
# Redis   = fast live state during a drop (stock counter, holds)
# Nginx and more servers get added in later steps.
services:
  mongo:
    image: mongo:7
    container_name: flashdrop-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: flashdrop-redis
    ports:
      - "6379:6379"

volumes:
  mongo-data:
