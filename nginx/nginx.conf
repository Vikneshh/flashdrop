# NGINX — the front door.
#
# 1. Serves the dashboard (static files built from client/).
# 2. Load-balances API traffic across 3 identical API servers.
# 3. Upgrades /socket.io/ to a websocket for the live feed.
#
# The API servers keep NO state in memory that matters: stock, holds, the
# waiting line and metrics all live in Redis. That's what makes it safe to
# send any request to any server.

worker_processes auto;

events {
  # Each proxied request uses 2 connections (browser→nginx, nginx→api).
  # The simulator alone opens ~500, so the default 1024 is too low.
  worker_connections 8192;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  access_log    off; # thousands of req/s of logs would just slow us down

  upstream api {
    # least_conn: send each request to the server with the fewest requests in
    # flight, so a slow server automatically gets less work.
    least_conn;

    # If a server stops answering, take it out for 5s and use the others.
    server api1:4000 max_fails=1 fail_timeout=5s;
    server api2:4000 max_fails=1 fail_timeout=5s;
    server api3:4000 max_fails=1 fail_timeout=5s;

    # Reuse connections to the API servers instead of opening one per request
    keepalive 256;
  }

  # Websockets need "Connection: upgrade"; normal requests need an empty
  # Connection header so the upstream keepalive above works.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 80;
    root /usr/share/nginx/html;

    # Common proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Append the caller's IP so the API can rate-limit the real client
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # If a server is down (connection refused) try the next one. Nginx never
    # re-sends a POST that a server already received, so no double-buys.
    proxy_next_upstream error timeout;
    proxy_connect_timeout 2s;

    # Public API routes only. /admin and the step-1 /buy demo routes are
    # deliberately NOT exposed to the internet.
    location ~ ^/(drops|simulations|health)(/|$) {
      proxy_set_header Connection "";
      proxy_pass http://api;
    }

    # Live dashboard feed
    location /socket.io/ {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1h;
      proxy_pass http://api;
    }

    # The dashboard (single-page app)
    location / {
      try_files $uri /index.html;
    }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
